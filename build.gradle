plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'

	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	}

	tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
		def modVersion = project.version
		inputs.property 'version', modVersion

		filesMatching('fabric.mod.json') {
			expand 'version': modVersion
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		def archiveName = base.archivesName.get()
		inputs.property 'archiveName', archiveName

		from(rootProject.file('LICENSE')) {
			rename { "${it}_${archiveName}" }
		}
	}
}
